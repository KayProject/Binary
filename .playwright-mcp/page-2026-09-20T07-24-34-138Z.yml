                - generic [ref=e205]:
                  - heading "Agents at Work Hackathon — live leaderboard" [level=1] [ref=e206]
                  - paragraph [ref=e207]:
                    - strong [ref=e208]: Celo mainnet · counting window 28 Aug 00:00 → 21 Sep 09:00 GMT · $5,000 in CELO
                  - paragraph [ref=e209]: Every track is decided by one of the queries on this page, published before the hackathon opens. Click any title to read the exact SQL. Nothing is scored on raw totals alone, and nothing that can be farmed is used as a metric.
                  - heading "How to read this" [level=2] [ref=e210]
                  - paragraph [ref=e211]:
                    - strong [ref=e212]: The headline counters
                    - text: count every tagged transaction and every x402 settlement attributed to a registered project, and the USD moved in them. Volume is
                    - strong [ref=e213]: net per transaction between independent parties
                    - text: ", not gross transfers: one economic event counts once, at its largest leg, and only when the other side is a wallet that moved a token on Celo in the 60 days before 28 August. That is the number a farm cannot inflate, so it is the one on the counter. The daily chart shows gross next to it so the gap is visible."
                  - paragraph [ref=e214]:
                    - strong [ref=e215]: Track 1 — Value Moved
                    - text: ranks on
                    - emphasis [ref=e216]: adjusted volume
                    - text: ", not gross. Value counts only between"
                    - strong [ref=e217]: independent parties
                    - text: ": the counterparty is not one of your wallets, and moved a token on Celo in the 60 days before 28 August (29 June to 28 August). Excluded by rule: address-to-self, mint and burn, trades against protocol contracts, and transfers touching your own contracts. Volume is then multiplied by"
                    - code [ref=e218]: least(1, distinct signers / 20)
                    - text: ", because six figures moved by three wallets is a float, not adoption. That signer count is taken across all of your counted payments, not only the independent ones."
                  - paragraph [ref=e219]:
                    - strong [ref=e220]: Track 2 — Real World Adoption
                    - text: has nothing to do with money moved. A free product with a genuine user base can win it outright. We count
                    - strong [ref=e221]: EIP-3009 authorisers and sponsored-relay signers, not just gas payers
                    - text: "— so if you sponsor gas or build a gasless MiniPay flow, your users still count. Last cycle this was the single biggest measurement problem: the best Celo-native UX looked like the worst adoption."
                  - paragraph [ref=e222]:
                    - strong [ref=e223]: Best Stablecoin Adoption
                    - text: judges the same three signals among projects using cNGN, Ripio wFIAT or USA₮, or settling over x402. Note that the facilitator currently settles USDC, USDT and USA₮, so USA₮ is the rail that can do both halves today. cNGN and Ripio count on their own, used anywhere on Celo.
                  - paragraph [ref=e224]:
                    - strong [ref=e225]: Track 3 — AskBots CLI Growth
                    - text: ranks
                    - emphasis [ref=e226]: improvement
                    - text: ", not standing. Every project is asked one standard question — \"Overall, how well does this property do what it sets out to do?\" (1-10) — and the gap between round one and round two is what scores, so a rough first round is an opportunity rather than a problem. It is deliberately not the project's own rating questions: a project picks those, so an easy one would clear any floor. The delta counts only when"
                    - strong [ref=e227]: round two is at least 5.0/10
                    - text: and both rounds cleared the 10-review minimum. Round two is a separate AskBots project cloned from round one —
                    - strong [ref=e228]: run it on the weekend of 19-20 September
                    - text: ". If the table says your row cannot be scored, the fix is usually the project URL on your registration: it must carry your project id, not be the homepage and not an"
                    - code [ref=e229]: /agent/
                    - text: link.
                  - paragraph [ref=e230]:
                    - strong [ref=e231]: Value counts from two sources
                    - text: ", because you can only tag one of them: transactions carrying your ERC-8021 attribution tag, and x402 settlements, which the facilitator relayer submits on your behalf and which therefore cannot carry your tag. Settlements are attributed by your registered wallet instead, so"
                    - strong [ref=e232]: add your agent wallet at registration
                    - text: or these read zero. Put only real contracts in
                    - emphasis [ref=e233]: own contracts
                    - text: ": that field excludes transfers, and a wallet listed there is treated as a wallet, not a contract."
                  - heading "Eligibility" [level=2] [ref=e234]
                  - paragraph [ref=e235]:
                    - text: Every table carries an
                    - strong [ref=e236]: eligible
                    - text: column. A project still in
                    - emphasis [ref=e237]: draft
                    - text: is registered but has not submitted, and is
                    - strong [ref=e238]: not eligible for a prize
                    - text: . Drafts are shown here with their real numbers and their would-be position, so nobody discovers on 21 September that they never pressed publish. Publish before
                    - strong [ref=e239]: 21 Sep 09:00 GMT
                    - text: .
                  - heading "What this page does not show" [level=2] [ref=e240]
                  - paragraph [ref=e241]:
                    - text: First-funder collapse and spawn-window clustering are judgement-bearing, so they run in a separate audit rather than on a public board. Anything found there is raised with the team privately first, with
                    - strong [ref=e242]: 48 hours of right of reply
                    - text: ", before any public statement. Zero pre-existing users is"
                    - emphasis [ref=e243]: ambiguous
                    - text: ", not disqualifying — it is equally what genuine onboarding looks like."
                  - paragraph [ref=e244]:
                    - strong [ref=e245]: Sponsored gas is not builder contribution.
                    - text: The fees table splits what you paid yourself from what our relayer paid for you. Only the first counts.
